<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Symmetric Layout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" style="--dir: row">
    <div class="content-half" style="--dir: column"> 
      <div class="content-quater">upper left</div>
      <div class="content-quater">lower left</div>
    
    </div>
    <div class="content-half" style="--dir: column"> 
      <div class="content-quater">upper right</div>
      <div class="btn">lower right button</div>
    </div>
  </div>
</body>
</html>
